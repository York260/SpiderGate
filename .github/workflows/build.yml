name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/release/app-release.apk gatekeeper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-apk
          path: gatekeeper.apk

      - name: Read version
        id: ver
        run: echo "name=v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          name: SpiderGate ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: gatekeeper.apk
